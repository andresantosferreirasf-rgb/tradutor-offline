
    
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Módulo ES</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        #status { padding: 15px; background: #f0f0f0; border-radius: 8px; margin-bottom: 15px; min-height: 40px; }
        .erro { background: #ffebee; color: #c62828; }
        .ok { background: #e8f5e9; color: #2e7d32; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🌐 Tradutor</h1>
    <div id="status">🔄 Iniciando...</div>
    <textarea id="entrada" placeholder="Digite em inglês..." disabled></textarea>
    <textarea id="saida" readonly placeholder="Tradução em português..." disabled></textarea>
    <button id="btn" disabled>⏳ Carregando...</button>

    <script type="module">
        // Carrega como MÓDULO — funciona diferente e costuma desbloquear
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');
        const entrada = document.getElementById('entrada');
        const saida = document.getElementById('saida');
        let tradutor = null;

        function status(texto, tipo='') {
            statusEl.className = tipo;
            statusEl.innerHTML = texto;
        }

        try {
            status('✅ Biblioteca carregada! Baixando modelo...', 'ok');
            
            tradutor = await pipeline('translation', 'Xenova/opus-mt-en-pt', {
                progress_callback: (d) => {
                    if (d.status === 'progress' && d.progress) {
                        const pct = Math.round(d.progress * 100);
                        status(`📥 Baixando: ${pct}%`);
                    }
                }
            });

            status('✅ Pronto! Escreva abaixo:', 'ok');
            btn.disabled = false;
            btn.textContent = '🔍 Traduzir';
            entrada.disabled = false;
            saida.disabled = false;

            btn.onclick = async () => {
                const texto = entrada.value.trim();
                if (!texto) { saida.value = '⚠️ Digite algo primeiro.'; return; }
                btn.disabled = true;
                btn.textContent = 'Traduzindo...';
                const res = await tradutor(texto, { max_new_tokens: 512 });
                saida.value = res[0].translation_text;
                btn.disabled = false;
                btn.textContent = '🔍 Traduzir';
            };

        } catch (e) {
            console.error(e);
            status(`❌ Erro: ${e.message}<br>Verifique sua rede ou tente com outra internet.`, 'erro');
        }
    </script>
</body>
</html>
